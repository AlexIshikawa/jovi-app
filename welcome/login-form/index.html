<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entre na sua conta • Meu Jovi</title>

    <link rel="stylesheet" href="/dist/output.css">
    <script src="/dist/bundle.js" defer></script>
</head>

<body class="min-h-dvh bg-[#f6f5f9] text-slate-900 antialiased">

    <main class="relative isolate flex min-h-dvh w-full flex-col overflow-hidden">

        <!-- Fundo: arcos de luz em tons pastel -->
        <img src="../../src/assets/bg-white-color.png" alt=""
            class="pointer-events-none absolute inset-0 -z-10 size-full select-none object-cover object-top"
            draggable="false" />

        <!-- Barra de status simulada -->
        <div aria-hidden="true"
            class="flex w-full items-center justify-between px-7 pt-[calc(0.9rem+env(safe-area-inset-top))]">
            <span data-status-time class="text-[15px] font-semibold">9:41</span>
            <span class="flex items-center gap-1.5">
                <svg viewBox="0 0 18 12" class="h-3 w-[18px]" fill="currentColor">
                    <rect x="0" y="8" width="3" height="4" rx="1" />
                    <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
                    <rect x="10" y="3" width="3" height="9" rx="1" />
                    <rect x="15" y="0" width="3" height="12" rx="1" />
                </svg>
                <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.4"
                    stroke-linecap="round">
                    <path d="M2.5 9a14 14 0 0 1 19 0" />
                    <path d="M6 12.8a9 9 0 0 1 12 0" />
                    <path d="M9.5 16.5a4 4 0 0 1 5 0" />
                    <circle cx="12" cy="19.5" r="0.6" fill="currentColor" />
                </svg>
                <svg viewBox="0 0 28 13" class="h-3 w-6">
                    <rect x="0.75" y="0.75" width="23.5" height="11.5" rx="3.5" fill="none" stroke="currentColor"
                        stroke-opacity="0.4" stroke-width="1.5" />
                    <rect x="2.5" y="2.5" width="20" height="8" rx="2" fill="currentColor" />
                    <path d="M26 4.5v4a2 2 0 0 0 0-4z" fill="currentColor" fill-opacity="0.4" />
                </svg>
            </span>
        </div>

        <!-- Voltar: retorna à tela "Configure seu Jovi" -->
        <a href="/welcome/configure/"
            class="mt-3 flex items-center gap-1.5 self-start rounded-lg px-4 py-1 text-lg text-indigo-700 transition-opacity active:opacity-60 focus-visible:outline-2 focus-visible:outline-indigo-700 [-webkit-tap-highlight-color:transparent]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
                <path d="M15 5l-7 7 7 7" />
            </svg>
            Voltar
        </a>

        <!-- Logo, título e descrição -->
        <div class="mt-[14dvh] flex flex-col items-center gap-3 px-8 text-center">
            <img src="/src/assets/logo/logo.png" alt="JOVI" class="w-[44%] max-w-48 brightness-0" draggable="false"
                data-reveal style="--reveal-order: 0" />
            <h1 class="text-3xl font-semibold tracking-tight" data-reveal style="--reveal-order: 1">Entre na sua conta
            </h1>
            <p class="max-w-80 text-base leading-snug text-slate-1000" data-reveal style="--reveal-order: 2">
                Conecte sua conta Jovi para sincronizar seus dados, preferências e o Meu Jovi em todos os seus
                dispositivos.
            </p>
        </div>

        <!-- Formulário: validação nativa do navegador; o envio é simulado pelo login-form.js -->
        <form data-login-form class="mt-8 flex flex-col gap-3 px-7 pb-[calc(2rem+env(safe-area-inset-bottom))]"
            data-reveal style="--reveal-order: 3">

            <!-- E-mail -->
            <div
                class="flex h-14 items-center gap-3 rounded-2xl border border-slate-300/80 bg-white/50 px-4 backdrop-blur-sm transition-colors focus-within:border-indigo-500 focus-within:bg-white/80 has-[:user-invalid]:border-rose-400">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                    class="size-6 shrink-0 text-slate-700" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2.5" />
                    <path d="M4 7l8 6 8-6" />
                </svg>
                <label for="login-email" class="sr-only">E-mail</label>
                <input id="login-email" name="email" type="email" required autocomplete="email" inputmode="email"
                    placeholder="E-mail"
                    class="min-w-0 flex-1 bg-transparent text-base text-slate-900 placeholder:text-slate-400 outline-none" />
            </div>

            <!-- Senha -->
            <div
                class="flex h-14 items-center gap-3 rounded-2xl border border-slate-300/80 bg-white/50 pl-4 pr-2 backdrop-blur-sm transition-colors focus-within:border-indigo-500 focus-within:bg-white/80 has-[:user-invalid]:border-rose-400">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                    class="size-6 shrink-0 text-slate-700" aria-hidden="true">
                    <rect x="5" y="11" width="14" height="10" rx="2" />
                    <path d="M8 11V7.5a4 4 0 0 1 8 0V11" />
                    <path d="M12 15v2" />
                </svg>
                <label for="login-password" class="sr-only">Senha</label>
                <input id="login-password" name="password" type="password" required minlength="6"
                    autocomplete="current-password" placeholder="Senha"
                    class="min-w-0 flex-1 bg-transparent text-base text-slate-900 placeholder:text-slate-400 outline-none" />

                <!-- Mostrar/ocultar senha: aria-pressed troca o ícone -->
                <button type="button" data-password-toggle aria-pressed="false" aria-label="Mostrar senha"
                    aria-controls="login-password"
                    class="group/eye flex size-10 shrink-0 items-center justify-center rounded-full text-slate-700 transition-colors active:bg-slate-900/5 focus-visible:outline-2 focus-visible:outline-indigo-600 cursor-pointer">
                    <!-- Senha oculta: olho cortado -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        class="size-6 group-aria-pressed/eye:hidden" aria-hidden="true">
                        <path d="M3 3l18 18" />
                        <path
                            d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a16 16 0 0 1-2.6 3.2M6.2 7.6A15.6 15.6 0 0 0 3 12s4 6 9 6a8.9 8.9 0 0 0 3.9-.9" />
                        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                    </svg>
                    <!-- Senha visível: olho aberto -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        class="hidden size-6 group-aria-pressed/eye:block" aria-hidden="true">
                        <path d="M3 12s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>

            <a href="#esqueci-senha"
                class="self-end rounded-md text-base text-indigo-700 transition-opacity active:opacity-60 focus-visible:outline-2 focus-visible:outline-indigo-700">
                Esqueci minha senha
            </a>

            <!-- Enviar: data-loading troca o texto pelo indicador -->
            <button href="/welcome/sync/"
                class="group/send relative mt-4 flex h-14 items-center justify-center rounded-2xl bg-indigo-700 text-lg font-medium text-white shadow-[0_12px_30px_-8px_rgba(67,56,202,0.6)] transition-[scale,background-color] active:scale-[0.98] active:bg-indigo-800 disabled:active:scale-100 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-indigo-700 cursor-pointer">
                <span class="group-data-loading/send:hidden">Sincronizar Meu Jovi</span>
                <span class="hidden items-center gap-2 group-data-loading/send:flex">
                    <span aria-hidden="true"
                        class="size-5 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
                    Sincronizando...
                </span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="absolute right-5 size-6 group-data-loading/send:hidden" aria-hidden="true">
                    <path d="M4 12h16M14 6l6 6-6 6" />
                </svg>
            </button>
        </form>
    </main>

    <script>
        // Hora real na barra de status simulada
        const statusTime = document.querySelector('[data-status-time]');
        const format = new Intl.DateTimeFormat('pt-BR', { hour: 'numeric', minute: '2-digit' });
        const tick = () => { statusTime.textContent = format.format(new Date()); };
        tick();
        setInterval(tick, 30000);
    </script>
</body>

</html>
