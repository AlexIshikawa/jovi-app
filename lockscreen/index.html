<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JOVI AI CAMERA</title>

    <!-- Fonte do relógio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/dist/output.css">
    <script src="/dist/bundle.js" defer></script>
</head>

<body class="h-dvh overflow-hidden bg-brand-dark-deep">

    <main class="relative h-dvh w-full overflow-hidden select-none">

        <img src="/src/assets/wallpaper2.png" alt="" class="absolute inset-0 size-full object-cover"
            draggable="false" />

        <a href="/configuracoes/index.html" aria-label="Configurações"
            class="absolute right-4 top-[calc(1rem+env(safe-area-inset-top))] z-10 flex size-11 items-center justify-center rounded-full bg-black/40 text-white ring-1 ring-white/15 backdrop-blur-md transition-colors active:bg-black/60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-5" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path
                    d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
            </svg>
        </a>

        <!-- Seletor de modo: centralizado no topo, abre um menu com a Popover API (sem JS) -->
        <div
            class="group/mode absolute left-1/2 top-[calc(1rem+env(safe-area-inset-top))] z-10 -translate-x-1/2 [--accent:var(--color-brand-purple)]">
            <button type="button" popovertarget="mode-menu"
                class="flex h-11 items-center gap-2.5 rounded-full border border-(--accent)/60 bg-black/40 pl-3.5 pr-3 text-sm font-medium text-white shadow-[0_0_20px_color-mix(in_oklab,var(--accent)_25%,transparent)] backdrop-blur-md transition-colors active:bg-black/60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white cursor-pointer [-webkit-tap-highlight-color:transparent]">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                    class="size-5 shrink-0 text-(--accent)" aria-hidden="true">
                    <rect x="5" y="11" width="14" height="10" rx="2" />
                    <path d="M8 11V7.5a4 4 0 0 1 8 0V11" />
                </svg>
                Padrão
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                    class="size-4 shrink-0 text-(--accent) transition-transform duration-200 group-has-[:popover-open]/mode:rotate-180"
                    aria-hidden="true">
                    <path d="M6 9l6 6 6-6" />
                </svg>
            </button>

            <!-- Menu: aparece por cima de tudo, fecha com Esc ou tocando fora -->
            <nav id="mode-menu" popover aria-label="Trocar modo"
                class="m-0 inset-auto left-1/2 top-[calc(4.5rem+env(safe-area-inset-top))] w-60 -translate-x-1/2 rounded-2xl border border-white/10 bg-brand-dark/95 p-1.5 text-white shadow-[0_16px_40px_rgba(0,0,0,0.5)] backdrop-blur-md">
                <a href="/lockscreen/" aria-current="page"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition-colors active:bg-white/10 aria-[current=page]:bg-(--accent)/15 aria-[current=page]:text-(--accent) focus-visible:outline-2 focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-5 shrink-0"
                        aria-hidden="true">
                        <rect x="5" y="11" width="14" height="10" rx="2" />
                        <path d="M8 11V7.5a4 4 0 0 1 8 0V11" />
                    </svg>
                    <span class="flex-1">Padrão</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="size-4 shrink-0"
                        aria-hidden="true">
                        <path d="M5 12.5l4.5 4.5L19 7.5" />
                    </svg>
                </a>
                <a href="/modo-viagem/lockscreen/"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition-colors active:bg-white/10 aria-[current=page]:bg-(--accent)/15 aria-[current=page]:text-(--accent) focus-visible:outline-2 focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-5 shrink-0"
                        aria-hidden="true">
                        <path d="M22 2L11 13" />
                        <path d="M22 2l-7 20-4-9-9-4z" />
                    </svg>
                    <span class="flex-1">Modo Viagem</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                        class="size-4 shrink-0 invisible" aria-hidden="true">
                        <path d="M5 12.5l4.5 4.5L19 7.5" />
                    </svg>
                </a>
                <a href="/modo-estudos/lockscreen/"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition-colors active:bg-white/10 aria-[current=page]:bg-(--accent)/15 aria-[current=page]:text-(--accent) focus-visible:outline-2 focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-5 shrink-0"
                        aria-hidden="true">
                        <path d="M22 9L12 4 2 9l10 5 10-5z" />
                        <path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5" />
                        <path d="M22 9v6" />
                    </svg>
                    <span class="flex-1">Modo Estudos</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                        class="size-4 shrink-0 invisible" aria-hidden="true">
                        <path d="M5 12.5l4.5 4.5L19 7.5" />
                    </svg>
                </a>
                <a href="/lockscreen/custom/index.html"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition-colors active:bg-white/10 aria-[current=page]:bg-(--accent)/15 aria-[current=page]:text-(--accent) focus-visible:outline-2 focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-5 shrink-0"
                        aria-hidden="true">
                        <path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z" />
                        <path d="M18.5 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" />
                    </svg>
                    <span class="flex-1">Meu modo</span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                        class="size-4 shrink-0 invisible" aria-hidden="true">
                        <path d="M5 12.5l4.5 4.5L19 7.5" />
                    </svg>
                </a>
            </nav>
        </div>

        <!-- Relógio e data -->
        <section class="absolute inset-0 flex flex-col items-center pt-[22%] text-white">

            <time id="clock"
                class="font-clock font-extralight text-[88px] leading-none tracking-tight drop-shadow-[0_2px_8px_rgba(80,30,0,0.35)]">
                --:--
            </time>

            <p id="date"
                class="font-clock font-normal text-[15px] mt-2 opacity-90 drop-shadow-[0_1px_4px_rgba(80,30,0,0.35)]">
            </p>

        </section>

        <!-- Overlay: só existe enquanto a roda da câmera está aberta (segurando o botão central) -->
        <span aria-hidden="true"
            class="pointer-events-none invisible absolute inset-0 z-20 bg-black/70 opacity-0 transition-[opacity,visibility] duration-300 in-[main:has([data-camera-menu][data-open])]:visible in-[main:has([data-camera-menu][data-open])]:opacity-100 in-[main:has([data-camera-menu][data-open])]:backdrop-blur-[2px]"></span>
        <!-- Botão da câmera com ondas, centralizado na tela -->
        <div class="absolute z-30 inset-0 flex items-center justify-center pointer-events-none">

            <!-- "group": todos os filhos reagem ao estado deste elemento via aceso: -->
            <div data-camera-menu class="group relative size-18 pointer-events-auto">

                <!-- Brilho atrás do botão: só aparece no estado aceso -->
                <span aria-hidden="true"
                    class="absolute -inset-6 rounded-full bg-[radial-gradient(circle,rgba(85,183,255,0.45)_0%,rgba(217,119,255,0.2)_45%,transparent_70%)] blur-md opacity-0 transition-opacity duration-300 aceso:opacity-100">
                </span>

                <!-- Ondas: discretas por padrão, intensas no estado aceso -->
                <div aria-hidden="true"
                    class="absolute inset-0 opacity-30 transition-opacity duration-300 aceso:opacity-100 motion-reduce:hidden">
                    <span
                        class="absolute inset-0 rounded-full border border-brand-purple transition-shadow duration-300 aceso:shadow-[0_0_12px_var(--color-brand-blue)] animate-wave">
                    </span>
                    <span
                        class="absolute inset-0 rounded-full border border-brand-blue transition-shadow duration-300 aceso:shadow-[0_0_12px_var(--color-brand-purple)] animate-wave [animation-delay:0.8s]">
                    </span>
                    <span
                        class="absolute inset-0 rounded-full border border-brand-purple transition-shadow duration-300 aceso:shadow-[0_0_12px_var(--color-brand-blue)] animate-wave [animation-delay:1.6s]">
                    </span>
                </div>

                <!-- Área invisível que mantém o menu aberto enquanto o mouse vai até os atalhos -->
                <span aria-hidden="true"
                    class="absolute -inset-36 pointer-events-none aceso:pointer-events-auto"></span>

                <!-- Setas: indicam as direções dos atalhos -->
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 size-4 text-white drop-shadow-[0_0_4px_var(--color-brand-purple)] opacity-0 transition-opacity duration-300 aceso:opacity-100">
                    <path d="M6 15l6-6 6 6" />
                </svg>
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="absolute left-full top-1/2 -translate-y-1/2 ml-1.5 rotate-90 size-4 text-white drop-shadow-[0_0_4px_var(--color-brand-purple)] opacity-0 transition-opacity duration-300 aceso:opacity-100">
                    <path d="M6 15l6-6 6 6" />
                </svg>
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="absolute top-full left-1/2 -translate-x-1/2 mt-1.5 rotate-180 size-4 text-white drop-shadow-[0_0_4px_var(--color-brand-purple)] opacity-0 transition-opacity duration-300 aceso:opacity-100">
                    <path d="M6 15l6-6 6 6" />
                </svg>
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="absolute right-full top-1/2 -translate-y-1/2 mr-1.5 -rotate-90 size-4 text-white drop-shadow-[0_0_4px_var(--color-brand-purple)] opacity-0 transition-opacity duration-300 aceso:opacity-100">
                    <path d="M6 15l6-6 6 6" />
                </svg>

                <!-- Atalhos: invisíveis por padrão, surgem do centro no estado aceso -->
                <!-- Atalho: Selfie -->
                <button type="button" data-shortcut="selfie" data-direction="up" data-label="Selfie"
                    class="group/sat absolute bottom-[calc(100%+64px)] left-1/2 -translate-x-1/2 translate-y-6 size-12 rounded-full invisible opacity-0 scale-75 transition-[opacity,scale,translate,visibility] duration-300 aceso:visible aceso:opacity-100 aceso:scale-100 aceso:translate-y-0 outline-none cursor-pointer [-webkit-tap-highlight-color:transparent]">

                    <!-- Corpo do círculo: cresce quando selecionado (arraste) ou com hover -->
                    <span
                        class="relative flex size-full items-center justify-center rounded-full transition-[scale] duration-200 ease-out group-hover/sat:scale-125 group-data-selected/sat:scale-125">
                        <span aria-hidden="true"
                            class="absolute inset-0 rounded-full bg-brand-dark-deep/80 shadow-[0_0_14px_rgba(217,119,255,0.4)] transition-shadow duration-200 group-hover/sat:shadow-[0_0_22px_rgba(217,119,255,0.75)] group-data-selected/sat:shadow-[0_0_22px_rgba(217,119,255,0.75)]"></span>
                        <span aria-hidden="true"
                            class="absolute inset-0 rounded-full gradient-ring [--ring-width:2px]"></span>
                        <span aria-hidden="true"
                            class="absolute -inset-1.5 rounded-full border-2 border-white opacity-0 group-focus-visible/sat:opacity-100"></span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            class="relative size-6 text-white" aria-hidden="true">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M4 20c0-3.5 3.6-5.5 8-5.5s8 2 8 5.5" />
                        </svg>
                    </span>

                    <span
                        class="absolute left-1/2 top-full mt-2.5 -translate-x-1/2 whitespace-nowrap font-clock text-[13px] text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.6)]">Selfie</span>
                </button>

                <!-- Atalho: Ask Mode (usa o vídeo do Modo Viagem e, ao terminar, abre o IA Guia) -->
                <button type="button" data-shortcut="viagem" data-direction="right" data-label="Agente"
                    class="group/sat absolute left-[calc(100%+48px)] top-1/2 -translate-y-1/2 -translate-x-6 size-12 rounded-full invisible opacity-0 scale-75 transition-[opacity,scale,translate,visibility] duration-300 aceso:visible aceso:opacity-100 aceso:scale-100 aceso:translate-x-0 aceso:delay-[40ms] outline-none cursor-pointer [-webkit-tap-highlight-color:transparent]">

                    <!-- Corpo do círculo: cresce quando selecionado (arraste) ou com hover -->
                    <span
                        class="relative flex size-full items-center justify-center rounded-full transition-[scale] duration-200 ease-out group-hover/sat:scale-125 group-data-selected/sat:scale-125">
                        <span aria-hidden="true"
                            class="absolute inset-0 rounded-full bg-brand-dark-deep/80 shadow-[0_0_14px_rgba(217,119,255,0.4)] transition-shadow duration-200 group-hover/sat:shadow-[0_0_22px_rgba(217,119,255,0.75)] group-data-selected/sat:shadow-[0_0_22px_rgba(217,119,255,0.75)]"></span>
                        <span aria-hidden="true"
                            class="absolute inset-0 rounded-full gradient-ring [--ring-width:2px]"></span>
                        <span aria-hidden="true"
                            class="absolute -inset-1.5 rounded-full border-2 border-white opacity-0 group-focus-visible/sat:opacity-100"></span>

                        <!-- Ícone: estrelas (IA) -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            class="relative size-6 text-white" aria-hidden="true">
                            <path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z" />
                            <path d="M18.5 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" />
                        </svg>
                    </span>

                    <span
                        class="absolute left-1/2 top-full mt-2.5 -translate-x-1/2 whitespace-nowrap font-clock text-[13px] text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.6)]">Agente
                    </span>
                </button>

                <!-- Atalho: Vídeo -->
                <button type="button" data-shortcut="video" data-direction="down" data-label="Vídeo"
                    class="group/sat absolute top-[calc(100%+64px)] left-1/2 -translate-x-1/2 -translate-y-6 size-12 rounded-full invisible opacity-0 scale-75 transition-[opacity,scale,translate,visibility] duration-300 aceso:visible aceso:opacity-100 aceso:scale-100 aceso:translate-y-0 aceso:delay-[80ms] outline-none cursor-pointer [-webkit-tap-highlight-color:transparent]">

                    <!-- Corpo do círculo: cresce quando selecionado (arraste) ou com hover -->
                    <span
                        class="relative flex size-full items-center justify-center rounded-full transition-[scale] duration-200 ease-out group-hover/sat:scale-125 group-data-selected/sat:scale-125">
                        <span aria-hidden="true"
                            class="absolute inset-0 rounded-full bg-brand-dark-deep/80 shadow-[0_0_14px_rgba(217,119,255,0.4)] transition-shadow duration-200 group-hover/sat:shadow-[0_0_22px_rgba(217,119,255,0.75)] group-data-selected/sat:shadow-[0_0_22px_rgba(217,119,255,0.75)]"></span>
                        <span aria-hidden="true"
                            class="absolute inset-0 rounded-full gradient-ring [--ring-width:2px]"></span>
                        <span aria-hidden="true"
                            class="absolute -inset-1.5 rounded-full border-2 border-white opacity-0 group-focus-visible/sat:opacity-100"></span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            class="relative size-6 text-white" aria-hidden="true">
                            <rect x="3" y="7" width="12" height="10" rx="2" />
                            <path d="M15 11l6-3v8l-6-3z" />
                        </svg>
                    </span>

                    <span
                        class="absolute left-1/2 top-full mt-2.5 -translate-x-1/2 whitespace-nowrap font-clock text-[13px] text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.6)]">Vídeo</span>
                </button>

                <!-- Atalho: Panorâmica -->
                <button type="button" data-shortcut="panoramica" data-direction="left" data-label="Panorâmica"
                    class="group/sat absolute right-[calc(100%+48px)] top-1/2 -translate-y-1/2 translate-x-6 size-12 rounded-full invisible opacity-0 scale-75 transition-[opacity,scale,translate,visibility] duration-300 aceso:visible aceso:opacity-100 aceso:scale-100 aceso:translate-x-0 aceso:delay-[120ms] outline-none cursor-pointer [-webkit-tap-highlight-color:transparent]">

                    <!-- Corpo do círculo: cresce quando selecionado (arraste) ou com hover -->
                    <span
                        class="relative flex size-full items-center justify-center rounded-full transition-[scale] duration-200 ease-out group-hover/sat:scale-125 group-data-selected/sat:scale-125">
                        <span aria-hidden="true"
                            class="absolute inset-0 rounded-full bg-brand-dark-deep/80 shadow-[0_0_14px_rgba(217,119,255,0.4)] transition-shadow duration-200 group-hover/sat:shadow-[0_0_22px_rgba(217,119,255,0.75)] group-data-selected/sat:shadow-[0_0_22px_rgba(217,119,255,0.75)]"></span>
                        <span aria-hidden="true"
                            class="absolute inset-0 rounded-full gradient-ring [--ring-width:2px]"></span>
                        <span aria-hidden="true"
                            class="absolute -inset-1.5 rounded-full border-2 border-white opacity-0 group-focus-visible/sat:opacity-100"></span>

                        <!-- Ícone: quadro largo com montanhas (panorâmica) -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                            class="relative size-6 text-white" aria-hidden="true">
                            <path d="M2 8c6.5-2 13.5-2 20 0v8c-6.5 2-13.5 2-20 0z" />
                            <path d="M6 14l3-3 2.5 2.5L14 11l4 3" />
                        </svg>
                    </span>

                    <span
                        class="absolute left-1/2 top-full mt-2.5 -translate-x-1/2 whitespace-nowrap font-clock text-[13px] text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.6)]">Panorâmica</span>
                </button>

                <!-- Botão -->
                <button type="button" aria-label="Abrir câmera" data-camera-trigger
                    class="touch-none [-webkit-touch-callout:none] relative flex size-full items-center justify-center rounded-full opacity-60 transition-[opacity,box-shadow,scale] duration-300 aceso:opacity-100 aceso:shadow-[0_0_24px_rgba(85,183,255,0.6),0_0_48px_rgba(217,119,255,0.35)] active:scale-95 outline-none cursor-pointer [-webkit-tap-highlight-color:transparent]">

                    <!-- Fundo escuro: transparente por padrão, aparece no estado aceso -->
                    <span aria-hidden="true"
                        class="absolute inset-0 rounded-full bg-[radial-gradient(circle_at_50%_35%,var(--color-brand-dark-light),var(--color-brand-dark-deep)_75%)] opacity-0 transition-opacity duration-300 aceso:opacity-100">
                    </span>

                    <!-- Anel em gradiente (com miolo vazado) -->
                    <span aria-hidden="true" class="absolute inset-0 rounded-full gradient-ring"></span>

                    <!-- Contorno de foco para navegação por teclado -->
                    <span aria-hidden="true"
                        class="absolute -inset-2 rounded-full border-2 border-white opacity-0 group-has-[:focus-visible]:opacity-100">
                    </span>

                    <!-- Ícone de câmera -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                        class="relative size-8 text-white transition-[filter] duration-300 drop-shadow-[0_1px_2px_rgba(0,0,0,0.25)] aceso:drop-shadow-[0_0_6px_var(--color-brand-blue)]"
                        aria-hidden="true">
                        <path
                            d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.2-1.8A1.5 1.5 0 0 1 10.55 3.5h2.9a1.5 1.5 0 0 1 1.25.7L15.9 6h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z" />
                        <circle cx="12" cy="12.5" r="3.5" />
                    </svg>
                </button>
            </div>
        </div>
        <a href="/memorias/index.html" aria-label="Abrir galeria" data-gallery
            class="absolute bottom-[calc(6%+env(safe-area-inset-bottom))] left-1/2 -translate-x-1/2 flex size-12 items-center justify-center rounded-xl border-2 border-white/90 bg-white/5 backdrop-blur-sm text-white opacity-80 transition-[opacity,scale] duration-200 active:scale-95 active:opacity-100 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-white cursor-pointer [-webkit-tap-highlight-color:transparent]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2.5" />
                <circle cx="8.5" cy="9.5" r="1.5" />
                <path d="M21 16l-5-5-9 9" />
            </svg>
        </a>
        <!-- Aviso rápido de qual atalho foi ativado -->
        <p id="toast" role="status" aria-live="polite"
            class="absolute bottom-[12%] left-1/2 -translate-x-1/2 whitespace-nowrap rounded-full bg-brand-dark-deep/85 px-4 py-2 font-clock text-sm text-white opacity-0 translate-y-2 transition-[opacity,translate] duration-300 data-visible:opacity-100 data-visible:translate-y-0">
        </p>
    </main>

    <script>
        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('date');

        const timeFormatter = new Intl.DateTimeFormat('pt-BR', {
            hour: '2-digit',
            minute: '2-digit',
        });

        const dateFormatter = new Intl.DateTimeFormat('pt-BR', {
            weekday: 'short',
            day: 'numeric',
            month: 'short',
        });

        function updateClock() {
            const now = new Date();

            clockEl.textContent = timeFormatter.format(now);           // ex.: 09:41
            clockEl.setAttribute('datetime', now.toISOString());       // acessibilidade/semântica

            dateEl.textContent = dateFormatter.format(now).replace(',', '');
        }

        function scheduleNextTick() {
            const now = new Date();
            const msUntilNextMinute =
                (60 - now.getSeconds()) * 1000 - now.getMilliseconds();

            setTimeout(() => {
                updateClock();
                scheduleNextTick();
            }, msUntilNextMinute);
        }

        updateClock();
        scheduleNextTick();

        // Safari no iOS só aplica :active em toques se existir um listener de touch na página
        document.addEventListener('touchstart', () => { }, { passive: true });
    </script>
