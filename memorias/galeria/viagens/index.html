<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Viagens</title>
    <link rel="stylesheet" href="/dist/output.css">
    <script src="/dist/bundle.js" defer></script>
</head>

<body class="min-h-dvh text-white antialiased">
    <app-header title="Galeria"></app-header>

    <main class="flex flex-col gap-5 px-4 pb-[calc(1.5rem+env(safe-area-inset-bottom))]">

        <!-- Cabeçalho do álbum -->
        <div class="flex items-center gap-3">
            <img src="/src/assets/gallery/viagens/cristo.jpg" alt=""
                class="size-14 shrink-0 rounded-xl object-cover ring-1 ring-white/10" decoding="async" />

            <div class="flex min-w-0 flex-1 flex-col">
                <h1 class="text-2xl font-bold leading-tight tracking-tight">Viagens</h1>
                <!-- Resumo calculado a partir do travel-data.js -->
                <p data-travel-summary class="text-xs leading-snug text-white/60"></p>
            </div>

            <button type="button"
                class="flex shrink-0 items-center gap-1.5 rounded-full border border-brand-purple/50 bg-brand-purple/15 px-3 py-2 text-xs font-medium transition-colors active:bg-brand-purple/25 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white cursor-pointer [-webkit-tap-highlight-color:transparent]">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 text-brand-purple"
                    aria-hidden="true">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                Novo álbum
            </button>
        </div>

        <!-- Sub-álbuns -->
        <section aria-labelledby="titulo-albuns-viagens">
            <h2 id="titulo-albuns-viagens" class="sr-only">Álbuns de viagens</h2>

            <!-- Cards gerados pelo travel-gallery.js a partir do travel-data.js -->
            <ul data-travel-albums class="grid grid-cols-2 gap-2.5"></ul>
        </section>
    </main>
</body>

</html>
