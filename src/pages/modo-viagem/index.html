<!DOCTYPE html>

    <link rel="stylesheet" href="/dist/output.css">
    <script type="module" src="/src/js/main.js"></script>

    <div class="relative min-h-screen overflow-hidden">

            <app-header title="Modo Viagem"></app-header>
