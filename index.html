<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JOVI • Meu Jovi</title>

    <link rel="stylesheet" href="/dist/output.css">
    <script src="/dist/bundle.js" defer></script>
</head>

<body class="h-dvh overflow-hidden bg-brand-dark-deep">

    <!-- data-welcome: tela inteira escuta o gesto de deslizar para cima -->
    <main data-welcome
        class="relative isolate flex h-dvh w-full touch-none select-none flex-col items-center overflow-hidden text-white transition-[opacity,translate] duration-300 ease-in data-leaving:-translate-y-8 data-leaving:opacity-0">

        <!-- Fundo -->
        <img src="/src/assets/bg-meujovi.png" alt="" class="absolute inset-0 -z-10 size-full object-cover"
            draggable="false" />

        <!-- Barra de status simulada -->
        <div aria-hidden="true"
            class="absolute right-5 top-[calc(0.9rem+env(safe-area-inset-top))] flex items-center gap-1.5 text-white">
            <!-- Sinal -->
            <svg viewBox="0 0 18 12" class="h-3 w-[18px]" fill="currentColor">
                <rect x="0" y="8" width="3" height="4" rx="1" />
                <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
                <rect x="10" y="3" width="3" height="9" rx="1" />
                <rect x="15" y="0" width="3" height="12" rx="1" opacity="0.4" />
            </svg>
            <!-- Wi-Fi -->
            <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round">
                <path d="M2.5 9a14 14 0 0 1 19 0" />
                <path d="M6 12.8a9 9 0 0 1 12 0" />
                <path d="M9.5 16.5a4 4 0 0 1 5 0" />
                <circle cx="12" cy="19.5" r="0.6" fill="currentColor" />
            </svg>
            <!-- Bateria -->
            <svg viewBox="0 0 28 13" class="h-3 w-6">
                <rect x="0.75" y="0.75" width="23.5" height="11.5" rx="3.5" fill="none" stroke="currentColor"
                    stroke-opacity="0.5" stroke-width="1.5" />
                <rect x="2.5" y="2.5" width="20" height="8" rx="2" fill="currentColor" />
                <path d="M26 4.5v4a2 2 0 0 0 0-4z" fill="currentColor" fill-opacity="0.5" />
            </svg>
        </div>

        <!-- Logo e nome do recurso -->
        <div class="mt-[38dvh] flex -translate-y-1/2 flex-col items-center gap-4">
            <img src="/src/assets/logo/logo-white.png" alt="JOVI"
                class="w-[58%] max-w-64 drop-shadow-[0_4px_24px_rgba(255,255,255,0.25)]" draggable="false" />
            <p class="pl-[0.5em] text-2xl font-light tracking-[0.5em] text-white/85">Meu Jovi</p>
        </div>

        <!-- Saudação: o texto visível é digitado pelo JS; o h1 escondido dá o significado para leitores de tela -->
        <h1 class="sr-only">Olá! Boas-vindas ao Meu Jovi</h1>
        <p aria-hidden="true" class="mt-[10dvh] flex h-12 items-center text-4xl font-medium">
            <span data-greeting lang="pt-BR">Olá</span>
            <!-- Cursor piscando -->
            <span class="ml-1 h-9 w-0.5 rounded-full bg-white/80 animate-pulse motion-reduce:hidden"></span>
        </p>

        <!-- Rodapé: continuar + alça + acessibilidade -->
        <div
            class="absolute inset-x-0 bottom-[calc(1.25rem+env(safe-area-inset-bottom))] flex flex-col items-center gap-5">
            <button type="button" data-continue
                class="rounded-full px-4 py-2 text-lg text-white/70 animate-pulse transition-colors active:text-white focus-visible:outline-2 focus-visible:outline-white motion-reduce:animate-none cursor-pointer [-webkit-tap-highlight-color:transparent]">
                Deslize para continuar
            </button>
            <span aria-hidden="true" class="h-1.5 w-36 rounded-full bg-white/90"></span>
        </div>

        <button type="button" aria-label="Opções de acessibilidade"
            class="absolute bottom-[calc(3.5rem+env(safe-area-inset-bottom))] right-5 flex size-12 items-center justify-center rounded-full ring-2 ring-white/80 transition-colors active:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white cursor-pointer [-webkit-tap-highlight-color:transparent]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-6" aria-hidden="true">
                <circle cx="12" cy="4.5" r="1.8" fill="currentColor" stroke="none" />
                <path d="M5 8.5c2.3.7 4.6 1 7 1s4.7-.3 7-1" />
                <path d="M12 9.5v5M9.5 21l2.5-6.5 2.5 6.5" />
            </svg>
        </button>
    </main>
</body>

</html>
