<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockscreen</title>

    <link rel="stylesheet" href="/dist/output.css">
    <script src="/dist/bundle.js" defer></script>
</head>

<body>
    <app-header title="Lockscreen"></app-header>
    <main class="m-4 flex flex-col gap-4">
        <div class="flex flex-col justify-center items-center gap-2">
            <app-gradient-text class="text-xl">Presets da Lockscreen</app-gradient-text>
            <p class="card-paragraph">
                Escolha um gesto e defina qual modo de câmera ele abre direto da tela de bloqueio
            </p>
        </div>

        <!-- Prévia dos gestos: preenchida conforme os modos marcados abaixo -->
        <app-gesture-wheel></app-gesture-wheel>

        <div>
            <h3>Modo para o gesto <app-gradient-text class="text-xl">Default 1</app-gradient-text></h3>
        </div>

        <!-- Checkboxes: é possível escolher vários modos (até 5 ficam em uso) -->
        <fieldset data-preset-picker>
            <legend class="sr-only">Escolha até 5 modos de câmera para os gestos</legend>

            <div class="grid grid-cols-2 gap-3">
                <!-- Selfie -->
                <label data-preset-option
                    class="group/card flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-3 cursor-pointer transition-[border-color,background-color,box-shadow] duration-300 has-checked:border-brand-purple/60 has-checked:bg-white/[0.08] has-checked:shadow-[0_0_24px_rgba(217,119,255,0.25)] has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <input type="checkbox" name="preset-mode" value="selfie" data-name="Selfie" class="sr-only" checked>

                    <app-icon variant="outline" shape="circle" class="size-10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="3.5" />
                            <path d="M5.5 19c0-3.2 2.9-5 6.5-5s6.5 1.8 6.5 5" />
                        </svg>
                    </app-icon>

                    <span class="flex min-w-0 flex-col gap-0.5">
                        <span class="flex items-center gap-1.5 text-sm font-semibold">
                            Selfie
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                class="hidden size-3.5 group-has-checked/card:block" aria-hidden="true">
                                <path d="M5 12.5l4.5 4.5L19 7.5" />
                            </svg>
                        </span>
                        <span class="text-xs leading-snug text-white/70">Câmera frontal com beleza IA</span>
                        <!-- Preenchido pelo JS com a posição do gesto (ex.: "Em uso: Cima") -->
                        <span data-slot-label hidden
                            class="mt-1 text-[10px] font-medium uppercase tracking-wider text-white/45"></span>
                    </span>
                </label>
                <!-- Noturno -->
                <label data-preset-option
                    class="group/card flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-3 cursor-pointer transition-[border-color,background-color,box-shadow] duration-300 has-checked:border-brand-purple/60 has-checked:bg-white/[0.08] has-checked:shadow-[0_0_24px_rgba(217,119,255,0.25)] has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <input type="checkbox" name="preset-mode" value="noturno" data-name="Noturno" class="sr-only">

                    <app-icon variant="outline" shape="circle" class="size-10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
                        </svg>
                    </app-icon>

                    <span class="flex min-w-0 flex-col gap-0.5">
                        <span class="flex items-center gap-1.5 text-sm font-semibold">
                            Noturno
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                class="hidden size-3.5 group-has-checked/card:block" aria-hidden="true">
                                <path d="M5 12.5l4.5 4.5L19 7.5" />
                            </svg>
                        </span>
                        <span class="text-xs leading-snug text-white/70">Capture em baixa luz com IA</span>
                        <!-- Preenchido pelo JS com a posição do gesto (ex.: "Em uso: Cima") -->
                        <span data-slot-label hidden
                            class="mt-1 text-[10px] font-medium uppercase tracking-wider text-white/45"></span>
                    </span>
                </label>
                <!-- Panorama -->
                <label data-preset-option
                    class="group/card flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-3 cursor-pointer transition-[border-color,background-color,box-shadow] duration-300 has-checked:border-brand-purple/60 has-checked:bg-white/[0.08] has-checked:shadow-[0_0_24px_rgba(217,119,255,0.25)] has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <input type="checkbox" name="preset-mode" value="panorama" data-name="Panorama" class="sr-only">

                    <app-icon variant="outline" shape="circle" class="size-10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 19l6-9 4 5 2-3 6 7z" />
                        </svg>
                    </app-icon>

                    <span class="flex min-w-0 flex-col gap-0.5">
                        <span class="flex items-center gap-1.5 text-sm font-semibold">
                            Panorama
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                class="hidden size-3.5 group-has-checked/card:block" aria-hidden="true">
                                <path d="M5 12.5l4.5 4.5L19 7.5" />
                            </svg>
                        </span>
                        <span class="text-xs leading-snug text-white/70">Paisagens em ângulo amplo</span>
                        <!-- Preenchido pelo JS com a posição do gesto (ex.: "Em uso: Cima") -->
                        <span data-slot-label hidden
                            class="mt-1 text-[10px] font-medium uppercase tracking-wider text-white/45"></span>
                    </span>
                </label>
                <!-- Vídeo -->
                <label data-preset-option
                    class="group/card flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-3 cursor-pointer transition-[border-color,background-color,box-shadow] duration-300 has-checked:border-brand-purple/60 has-checked:bg-white/[0.08] has-checked:shadow-[0_0_24px_rgba(217,119,255,0.25)] has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <input type="checkbox" name="preset-mode" value="video" data-name="Vídeo" class="sr-only">

                    <app-icon variant="outline" shape="circle" class="size-10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="7" width="12" height="10" rx="2" />
                            <path d="M15 11l6-3v8l-6-3z" />
                        </svg>
                    </app-icon>

                    <span class="flex min-w-0 flex-col gap-0.5">
                        <span class="flex items-center gap-1.5 text-sm font-semibold">
                            Vídeo
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                class="hidden size-3.5 group-has-checked/card:block" aria-hidden="true">
                                <path d="M5 12.5l4.5 4.5L19 7.5" />
                            </svg>
                        </span>
                        <span class="text-xs leading-snug text-white/70">Gravação rápida em 4K</span>
                        <!-- Preenchido pelo JS com a posição do gesto (ex.: "Em uso: Cima") -->
                        <span data-slot-label hidden
                            class="mt-1 text-[10px] font-medium uppercase tracking-wider text-white/45"></span>
                    </span>
                </label>
                <!-- Criador -->
                <label data-preset-option
                    class="group/card flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-3 cursor-pointer transition-[border-color,background-color,box-shadow] duration-300 has-checked:border-brand-purple/60 has-checked:bg-white/[0.08] has-checked:shadow-[0_0_24px_rgba(217,119,255,0.25)] has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <input type="checkbox" name="preset-mode" value="criador" data-name="Criador" class="sr-only">

                    <app-icon variant="outline" shape="circle" class="size-10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7L4.5 9.5l4.7-1.8z" />
                            <path d="M18.5 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" />
                        </svg>
                    </app-icon>

                    <span class="flex min-w-0 flex-col gap-0.5">
                        <span class="flex items-center gap-1.5 text-sm font-semibold">
                            Criador
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                class="hidden size-3.5 group-has-checked/card:block" aria-hidden="true">
                                <path d="M5 12.5l4.5 4.5L19 7.5" />
                            </svg>
                        </span>
                        <span class="text-xs leading-snug text-white/70">Modo Pro para conteúdo</span>
                        <!-- Preenchido pelo JS com a posição do gesto (ex.: "Em uso: Cima") -->
                        <span data-slot-label hidden
                            class="mt-1 text-[10px] font-medium uppercase tracking-wider text-white/45"></span>
                    </span>
                </label>
                <!-- Viagem -->
                <label data-preset-option
                    class="group/card flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-3 cursor-pointer transition-[border-color,background-color,box-shadow] duration-300 has-checked:border-brand-purple/60 has-checked:bg-white/[0.08] has-checked:shadow-[0_0_24px_rgba(217,119,255,0.25)] has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <input type="checkbox" name="preset-mode" value="viagem" data-name="Viagem" class="sr-only">

                    <app-icon variant="outline" shape="circle" class="size-10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 2L11 13" />
                            <path d="M22 2l-7 20-4-9-9-4z" />
                        </svg>
                    </app-icon>

                    <span class="flex min-w-0 flex-col gap-0.5">
                        <span class="flex items-center gap-1.5 text-sm font-semibold">
                            Viagem
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                class="hidden size-3.5 group-has-checked/card:block" aria-hidden="true">
                                <path d="M5 12.5l4.5 4.5L19 7.5" />
                            </svg>
                        </span>
                        <span class="text-xs leading-snug text-white/70">HDR + geo-tag automáticos</span>
                        <!-- Preenchido pelo JS com a posição do gesto (ex.: "Em uso: Cima") -->
                        <span data-slot-label hidden
                            class="mt-1 text-[10px] font-medium uppercase tracking-wider text-white/45"></span>
                    </span>
                </label>
                <!-- Retrato -->
                <label data-preset-option
                    class="group/card flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-3 cursor-pointer transition-[border-color,background-color,box-shadow] duration-300 has-checked:border-brand-purple/60 has-checked:bg-white/[0.08] has-checked:shadow-[0_0_24px_rgba(217,119,255,0.25)] has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <input type="checkbox" name="preset-mode" value="retrato" data-name="Retrato" class="sr-only">

                    <app-icon variant="outline" shape="circle" class="size-10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9" />
                            <path
                                d="M14.3 3.3L9 12.5M20.6 9H10M18.8 17.2l-5.3-9.2M9.7 20.7l5.3-9.2M3.4 15H14M5.2 6.8l5.3 9.2" />
                        </svg>
                    </app-icon>

                    <span class="flex min-w-0 flex-col gap-0.5">
                        <span class="flex items-center gap-1.5 text-sm font-semibold">
                            Retrato
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                class="hidden size-3.5 group-has-checked/card:block" aria-hidden="true">
                                <path d="M5 12.5l4.5 4.5L19 7.5" />
                            </svg>
                        </span>
                        <span class="text-xs leading-snug text-white/70">Bokeh natural com IA</span>
                        <!-- Preenchido pelo JS com a posição do gesto (ex.: "Em uso: Cima") -->
                        <span data-slot-label hidden
                            class="mt-1 text-[10px] font-medium uppercase tracking-wider text-white/45"></span>
                    </span>
                </label>
                <!-- Dia -->
                <label data-preset-option
                    class="group/card flex items-start gap-3 rounded-2xl border border-white/10 bg-white/[0.03] p-3 cursor-pointer transition-[border-color,background-color,box-shadow] duration-300 has-checked:border-brand-purple/60 has-checked:bg-white/[0.08] has-checked:shadow-[0_0_24px_rgba(217,119,255,0.25)] has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-white [-webkit-tap-highlight-color:transparent]">
                    <input type="checkbox" name="preset-mode" value="dia" data-name="Dia" class="sr-only">

                    <app-icon variant="outline" shape="circle" class="size-10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4" />
                            <path
                                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                        </svg>
                    </app-icon>

                    <span class="flex min-w-0 flex-col gap-0.5">
                        <span class="flex items-center gap-1.5 text-sm font-semibold">
                            Dia
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                                class="hidden size-3.5 group-has-checked/card:block" aria-hidden="true">
                                <path d="M5 12.5l4.5 4.5L19 7.5" />
                            </svg>
                        </span>
                        <span class="text-xs leading-snug text-white/70">Cores vivas em luz forte</span>
                        <!-- Preenchido pelo JS com a posição do gesto (ex.: "Em uso: Cima") -->
                        <span data-slot-label hidden
                            class="mt-1 text-[10px] font-medium uppercase tracking-wider text-white/45"></span>
                    </span>
                </label>
            </div>
        </fieldset>
        <app-button class="w-full mt-4" href="./configure-preset/index.html">Salvar meus gestos</app-button>
    </main>
</body>

</html>
